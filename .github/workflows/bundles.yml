# Windows and Linux installers for a release, built with packaging/bundle.sh on GitHub's machines (run it from the Actions
# tab). They come back unsigned for the updater: download the artifacts into dist/ next to the macOS build, then run
# packaging/sign.sh on your own computer (the release key never leaves it).
name: Installers
on: workflow_dispatch
permissions:
  contents: read
jobs:
  bundle:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4
        with:
          node-version: 22
      - name: Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: cargo install tauri-cli --version 2.12.4 --locked
      - run: ./packaging/bundle.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: installers-${{ runner.os }}
          path: dist/*
