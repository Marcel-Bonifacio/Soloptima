# Checks every push and pull request: the type check and tests of the interface, and the engine tests (the quick ones; the
# slow comparisons run with cargo test --release on a developer machine).
name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4
        with:
          node-version: 22
      - run: npm --prefix ui ci --ignore-scripts
      - run: npm --prefix ui run check
      - run: node tests/layout_geometry.test.js && node --test ui/tests/*.test.js
      - run: node tools/filemap.mjs --check
  engine:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
      - run: cargo test -p soloptima-engine --locked
