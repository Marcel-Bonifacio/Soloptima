[package]
name = "soloptima-engine"
version = "1.2.0"
edition = "2021"
license = "Apache-2.0"
description = "Soloptima engine in Rust (rewrite phase 2): model, JSON, validation; more modules follow"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["gzip"] }
url = "2"

[dev-dependencies]
sha2 = "0.10"
